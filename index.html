cdT:"మా వివాహానికి మిగిలిన సమయం",dy:"రోజులు",hr:"గంటలు",mi:"నిమిషాలు",se:"సెకన్లు",cdDone:"మా వివాహ వేడుక ప్రారంభమైంది. మీ ఆశీస్సులకు ధన్యవాదాలు!",
whT:"తేదీ, సమయం, వేదిక",dateL:"తేదీ",dateV:"18 ఫిబ్రవరి 2027",timeL:"సమయం",timeV:"ఉదయం 6:00 (IST)",venL:"వేదిక",venV:"కొండాపూర్ యాప, తెలంగాణ, భారతదేశం",dir:"📍 దారి చూపించు",
gaT:"మా మధుర క్షణాలు",meT:"జంట ఫోటోల జ్ఞాపకశక్తి ఆట",again:"మళ్ళీ ఆడండి",memWin:"అభినందనలు! మీరు అన్ని ఫోటో జతలను సరిగ్గా కలిపారు. 🎉",moves:"ప్రయత్నాలు",
quT:"ప్రణయ్, ప్రియాంక గురించి మీకు ఎంత తెలుసు?",next:"తరువాత",score:"మీ స్కోరు",quWin:"అద్భుతం! మా వివాహ వివరాలు మీకు బాగా తెలుసు! 🎉",quMid:"మంచి ప్రయత్నం! ఆహ్వానాన్ని మళ్ళీ చదివి ఇంకోసారి ప్రయత్నించండి. 😊",
gn:"అతిథి పేరు",gc:"అతిథుల సంఖ్య",ga:"మీరు వస్తారా?",yes:"అవును, సంతోషంగా వస్తాము",no:"క్షమించండి, రాలేకపోతున్నాము",rsB:"వాట్సాప్‌లో రిప్లై పంపండి",
rsN:"మీ రిప్లై కుటుంబానికి వాట్సాప్ సందేశంగా తెరుచుకుంటుంది. ఇది ఈ వెబ్‌సైట్‌లో నిల్వ చేయబడదు.",cont:"సంప్రదించవలసిన నంబర్:",needName:"దయచేసి మీ పేరు నమోదు చేయండి.",
shr:"ఆహ్వానాన్ని వాట్సాప్‌లో పంచుకోండి",clT:"మీ ఆశీస్సులతో",clM:"మీ ఆశీస్సులు మా నూతన జీవితాన్ని మరింత అందంగా మారుస్తాయి. మా ఆనందంలో భాగమైనందుకు కృతజ్ఞతలు.",
sh:(u)=>`🙏 ${NM} వివాహ వేడుకకు మిమ్మల్ని ఆహ్వానిస్తున్నాము\n📅 18 ఫిబ్రవరి 2027, ఉదయం 6:00 (IST)\n📍 కొండాపూర్ యాప, తెలంగాణ, భారతదేశం\n\nమా ఆహ్వానం చూడండి: ${u}`,
rv:(n,c,a)=>`🙏 నమస్తే! ${NM} వివాహానికి (18 ఫిబ్రవరి 2027) రిప్లై.\nపేరు: ${n}\nఅతిథుల సంఖ్య: ${c}\n${a}`}};
let L="en";const $=s=>document.querySelector(s);
/* ---- SAMPLE QUIZ: edit questions here. Each option is [English, Telugu]. a = index of correct answer ---- */
const QUIZ=[
{q:["What is the name of the groom’s father?","వరుడి తండ్రి పేరు ఏమిటి?"],o:[["Rajkumar","రాజ్‌కుమార్"],["Rakesh Sharma","రాకేష్ శర్మ"],["Gopathi","గోపతి"]],a:0},
{q:["What is the name of the bride’s mother?","వధువు తల్లి పేరు ఏమిటి?"],o:[["Varalakshmi","వరలక్ష్మి"],["Saretha","సారెత"],["Priyanka","ప్రియాంక"]],a:1},
{q:["On which date is the wedding?","వివాహం ఏ తేదీన జరుగుతుంది?"],o:[["18 February 2027","18 ఫిబ్రవరి 2027"],["8 February 2027","8 ఫిబ్రవరి 2027"],["18 March 2027","18 మార్చి 2027"]],a:0},
{q:["At what time does the wedding begin?","వివాహం ఏ సమయానికి ప్రారంభమవుతుంది?"],o:[["6:00 PM","సాయంత్రం 6:00"],["6:00 AM","ఉదయం 6:00"],["12:00 noon","మధ్యాహ్నం 12:00"]],a:1},
{q:["Where is the wedding venue?","వివాహ వేదిక ఎక్కడ ఉంది?"],o:[["Kondapur Yapa, Telangana","కొండాపూర్ యాప, తెలంగాణ"],["Vijayawada, Andhra Pradesh","విజయవాడ, ఆంధ్రప్రదేశ్"],["Chennai, Tamil Nadu","చెన్నై, తమిళనాడు"]],a:0}];

function setLang(l){L=l;document.documentElement.lang=l;document.body.classList.toggle("te",l==="te");
 document.querySelectorAll("[data-i]").forEach(e=>{const v=T[l][e.dataset.i];if(typeof v==="string")e.textContent=v});
 $("#langBtn").textContent=l==="en"?"తెలుగు":"English";
 const o=$("#ga").options;o[0].textContent=T[l].yes;o[1].textContent=T[l].no;
 tick();renderQuiz();$("#memMsg").textContent=won?T[l].memWin:"";}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("#langBtn").onclick=()=>setLang(L==="en"?"te":"en");

/* petals */
function petals(n){for(let i=0;i<n;i++){const p=document.createElement("span");p.className="petal";p.textContent=["🌸","🌺","🏵️","🌼"][i%4];
 p.style.left=Math.random()*100+"vw";p.style.fontSize=14+Math.random()*14+"px";p.style.setProperty("--dx",(Math.random()*120-60)+"px");
 p.style.animationDuration=4+Math.random()*4+"s";p.style.animationDelay=Math.random()*2+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),10500)}}
petals(18);

/* music (single audio element => never overlaps) */
const au=new Audio();au.loop=true;au.preload="none";au.src=MUSIC_MAIN;let cur=0;
const pp=$("#pp"),mu=$("#mu"),trk=$("#trk");
function sync(){pp.textContent=au.paused?"▶":"⏸";mu.textContent=au.muted?"🔇":"🔊"}
pp.onclick=()=>{au.paused?au.play().catch(()=>{}):au.pause();sync()};
mu.onclick=()=>{au.muted=!au.muted;sync()};
trk.onclick=()=>{cur=1-cur;au.src=cur?MUSIC_OPTIONAL:MUSIC_MAIN;au.play().catch(()=>{});sync()};
au.onplay=au.onpause=sync;
{const t=new Audio();t.preload="metadata";t.onloadedmetadata=()=>{trk.style.display="inline-block"};t.src=MUSIC_OPTIONAL}  // shows only if optional file exists

$("#enter").onclick=()=>{$("#open").classList.add("go");petals(30);au.play().catch(()=>{});sync()}; // click = user interaction, so music may start

/* countdown */
const target=new Date(WEDDING_ISO).getTime();
function tick(){let d=target-Date.now();const done=d<=0;if(done)d=0;
 $("#dd").textContent=Math.floor(d/864e5);$("#hh").textContent=Math.floor(d%864e5/36e5);
 $("#mm").textContent=Math.floor(d%36e5/6e4);$("#ss").textContent=Math.floor(d%6e4/1e3);
 $("#cdDone").textContent=done?T[L].cdDone:""}
setInterval(tick,1000);

/* ceremony animation: mandap, seven-step orbit, visible mangalya dharana, blessing */
const st=$("#stage"),cap=$("#cap"),gr=$("#gr"),br=$("#br");let timers=[],raf=0;
function put(g,x,y,s){g.setAttribute("transform",`translate(${x} ${y}) scale(${s})`)}
function scene(n,c){st.dataset.s=n;cap.textContent=c}
function play(){
 timers.forEach(clearTimeout);cancelAnimationFrame(raf);timers=[];
 $("#mgl").style.transition="none";$("#mgl").style.strokeDashoffset="70";
 $("#pend").style.opacity=0;$("#pend").style.transform="translate(0 0)";
 $("#knot").style.opacity=0;$("#knot").style.transform="scale(.2)";
 put(gr,165,225,1.1);put(br,235,225,1.1);scene(1,T[L].c1);
 timers.push(setTimeout(()=>{
  scene(2,T[L].c2);const t0=performance.now(),duration=9000;
  (function loop(now){
   const t=Math.min(1,(now-t0)/duration);
   const a=t*2*Math.PI;
   const step=Math.min(7,Math.floor(t*7)+1);
   $("#stepT").textContent=T[L].step+" "+step+" / 7";
   [[gr,0],[br,Math.PI]].forEach(([g,o])=>{
    const th=a+o,x=200+94*Math.cos(th),y=218+31*Math.sin(th);
    put(g,x,y,.82+.22*(Math.sin(th)+1)/2);
   });
   if(t<1)raf=requestAnimationFrame(loop);
  })(t0);
 },3500));
 timers.push(setTimeout(()=>{
  scene(3,T[L].c3);
  $("#mgl").style.transition="stroke-dashoffset 3s ease-in-out";
  $("#pend").style.transition="opacity .5s,transform 1.4s ease-in-out";
  $("#knot").style.transition="opacity .6s,transform .8s ease-out";
  // The groom brings the sacred thread/necklace into place; pendant lowers, then knot is secured.
  requestAnimationFrame(()=>{$("#mgl").style.strokeDashoffset="0";$("#pend").style.opacity=1;$("#pend").style.transform="translate(0 0)"});
  timers.push(setTimeout(()=>{$("#pend").style.transform="translate(0 -15px)";$("#knot").style.opacity=1;$("#knot").style.transform="scale(1.5)"},2100));
  timers.push(setTimeout(()=>{$("#knot").style.transform="scale(1)";$("#pend").style.transform="translate(0 0)"},3400));
 },13500));
 timers.push(setTimeout(()=>{
  scene(4,T[L].c4);put(gr,165,225,1.1);put(br,235,225,1.1);petals(40);
 },19500));
 timers.push(setTimeout(()=>{cap.textContent=T[L].c4},22500));
}
$("#replay").onclick=play;
new IntersectionObserver(e=>{if(e[0].isIntersecting&&st.dataset.s==="0")play()},{threshold:.5}).observe(st);

/* gallery */
const gal=$("#gal"),lb=$("#lb");
PHOTOS.forEach((f,i)=>{const im=new Image();im.src="assets/photos/"+f;im.loading="lazy";im.alt="Pranay and Priyanka – photo "+(i+1);im.onclick=()=>{lb.querySelector("img").src=im.src;lb.classList.add("on")};gal.appendChild(im)});
lb.onclick=e=>{if(e.target!==lb.querySelector("img"))lb.classList.remove("on")};

/* memory game (first 4 photos, 8 cards) */
let won=false,first=null,lock=false,moves=0,matched=0;
function memInit(){won=false;first=null;lock=false;moves=0;matched=0;$("#memMsg").textContent="";const m=$("#mem");m.innerHTML="";
 const ids=PHOTOS.slice(0,4);const deck=[...ids,...ids].sort(()=>Math.random()-.5);
 deck.forEach(f=>{const c=document.createElement("button");c.className="card";c.setAttribute("aria-label","Card");c.dataset.f=f;
  c.innerHTML=`<i><span class="bk">❁</span><img src="assets/photos/${f}" alt=""></i>`;
  c.onclick=()=>{if(lock||c.classList.contains("on"))return;c.classList.add("on");
   if(!first){first=c;return}moves++;
   if(first.dataset.f===c.dataset.f){matched++;first=null;if(matched===4){won=true;$("#memMsg").textContent=T[L].memWin+" ("+T[L].moves+": "+moves+")";petals(25)}}
   else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove("on");c.classList.remove("on");lock=false},800)}};
  m.appendChild(c)})}
$("#memReset").onclick=memInit;

/* quiz */
let qi=0,sc=0;
function renderQuiz(){const q=$("#quiz"),li=L==="en"?0:1;
 if(qi>=QUIZ.length){q.innerHTML=`<h3>${T[L].score}: ${sc} / ${QUIZ.length}</h3><p>${sc>=4?T[L].quWin:T[L].quMid}</p><button id="qr">${T[L].again}</button>`;$("#qr").onclick=()=>{qi=0;sc=0;renderQuiz()};return}
 const d=QUIZ[qi];q.innerHTML=`<p class="note">${qi+1} / ${QUIZ.length}</p><p><b>${d.q[li]}</b></p>`;
 d.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=o[li];
  b.onclick=()=>{if(q.dataset.done)return;q.dataset.done=1;const bs=q.querySelectorAll(".opt");bs[d.a].classList.add("ok");if(i===d.a)sc++;else b.classList.add("no");
   setTimeout(()=>{delete q.dataset.done;qi++;renderQuiz()},1100)};q.appendChild(b)})}

/* RSVP + share (no backend: opens WhatsApp) */
$("#rsvpBtn").onclick=()=>{const n=$("#gn").value.trim();if(!n){alert(T[L].needName);$("#gn").focus();return}
 const a=$("#ga").options[$("#ga").selectedIndex].textContent;
 open(`https://wa.me/${PHONE}?text=`+encodeURIComponent(T[L].rv(n,$("#gc").value||1,a)),"_blank")};
$("#share").onclick=()=>open("https://wa.me/?text="+encodeURIComponent(T[L].sh(location.href.split("#")[0])),"_blank");

setLang("en");memInit();
</script>
